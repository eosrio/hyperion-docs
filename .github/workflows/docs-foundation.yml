name: Docs validation
on:
  pull_request:
    paths: ['website/**', '.github/workflows/docs-foundation.yml', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:migration
      - uses: actions/upload-artifact@v4
        with:
          name: docs-4.5-node-${{ matrix.node }}
          path: website/build
